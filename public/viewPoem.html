<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="/css/font_awesome6.all.min.css">
    <link rel="stylesheet" href="/css/basic.css">
    <style>
        .poem-container {
            position: relative;
            max-width: 1200px;
            margin: 20px auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .poem-header {
            margin-bottom: 20px;
        }

        .poem-title {
            font-size: 36px;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .poem-meta {
            color: #6c757d;
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .poem-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }

        .poem-tag {
            background: rgba(163, 31, 36, 0.1);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 14px;
            border: 1px solid rgba(163, 31, 36, 0.3);
            transition: all 0.3s;
            cursor: pointer;
        }

        .poem-tag:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-1px);
        }

        .text-center {
            text-align: center !important;
            text-indent: 0 !important;
        }

        .text-left {
            text-indent: 2em;
        }

        .line-container {
            margin: 12px 0;
            font-size: 24px;
        }

        .toggle {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .toggle:hover {
            background: var(--primary-color-hover);
        }

        .poem-content {
            line-height: 1.8;
        }

        .original-line {
            margin: 12px 0;
            color: #212529;
        }

        .translated-line {
            color: #6c757d;
            font-size: 0.9em;
            display: none;
        }

        .show-translation .translated-line {
            display: block;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 拼音显示样式 */
        .pinyin-line {
            display: none;
            color: #8a1a1f;
            font-size: 0.8em;
            text-align: center;
            line-height: 1.6;
            letter-spacing: 1.7px;
            margin-bottom: 4px;
            opacity: 0.85;
        }

        .show-pinyin .pinyin-line {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .poem-container {
                padding: 20px;
            }

            .line-container {
                font-size: 18px;
            }

            .poem-title {
                font-size: 28px;
            }

            .poem-meta {
                font-size: 18px;
            }

            .controls-container {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .pinyin-line {
                letter-spacing: 1.3px;
            }
        }
    </style>
    <script src="/js/navbar.js"></script>
    <script src="/js/backButton.js"></script>
    <script src="/js/footer.js"></script>
</head>

<body>
    <div id="navbar-container"></div>

    <div class="poem-container">
        <a href="#" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
            返回
        </a>

        <div class="poem-header">
            <h1 class="poem-title" id="poemTitle"></h1>
            <div class="poem-meta" id="poemMeta"></div>
            <div class="poem-tags" id="poemTags"></div>
        </div>

        <div class="controls-container">
            <button class="toggle" onclick="toggleTranslation()">
                <i class="fa-solid fa-language"></i>
                <span id="translationText">显示翻译</span>
            </button>
            <button class="toggle" onclick="togglePinyin()">
                <i class="fa-solid fa-icons"></i>
                <span id="pinyinText">显示拼音</span>
            </button>
        </div>

        <div class="poem-content" id="poemContent"></div>
    </div>

    <div id="footer-container"></div>

    <script>
        async function loadPoem() {
            const title = decodeURIComponent(location.pathname.slice(1));
            try {
                const response = await fetch(`/poem?title=${title}`);
                if (!response.ok) throw new Error('未找到对应的古诗文');
                let poem = await response.json();
                poem = poem[0];

                document.title = poem.title;
                document.getElementById('poemTitle').textContent = poem.title;

                // 添加标签展示
                const tagsHTML = poem.tags?.map(tag =>
                    `<span class="poem-tag">${tag}</span>`
                ).join('') || '';
                document.getElementById('poemTags').innerHTML = tagsHTML;

                // 设置作者链接
                document.getElementById('poemMeta').innerHTML = `
                    【${poem.dynasty}】<a href="/author/${encodeURIComponent(poem.author)}" 
                     style="color: var(--primary-color-hover);text-decoration: none;">
                     ${poem.author}</a>
                `;

                // 生成内容
                const contentHTML = poem.content.map(c => `
                    <div class="line-container ${c.display || poem.display ? 'text-' + (c.display || poem.display) : ''}">
                        <div class="original-line">${c.line}</div>
                        <div class="translated-line">${c.trans}</div>
                    </div>
                `).join('');

                document.getElementById('poemContent').innerHTML = contentHTML;
            } catch (error) {
                document.body.innerHTML = '<h1>加载失败</h1>';
                console.error(error);
            }
        }

        function toggleTranslation() {
            const container = document.getElementById('poemContent');
            const button = document.querySelector('.translation-toggle');
            container.classList.toggle('show-translation');

            button.textContent = container.classList.contains('show-translation')
                ? '隐藏翻译'
                : '显示翻译';
        }

        loadPoem();
    </script>
</body>

</html>
