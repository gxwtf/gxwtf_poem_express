<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古诗文详情</title>
    <link rel="stylesheet" href="/css/font_awesome6.all.min.css">
    <style>
        :root {
            --primary-color: #A31F24;
            --tag-color: #1890ff;
        }

        body {
            font-family: "思源宋体", SimSun, serif;
            background: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        .back-button {
            position: absolute;
            top: 15px;
            left: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .back-button i {
            margin-right: 5px;
        }

        .poem-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .poem-title {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 10px;
            text-align: center;
        }

        .poem-meta {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .text-center {
            text-align: center !important;
            text-indent: 0 !important;
        }

        .text-left {
            text-indent: 2em;
        }

        .line-container {
            margin: 12px 0;
        }

        .translation-toggle {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .translation-toggle:hover {
            background: #8a1a1f;
        }

        .poem-content {
            line-height: 1.8;
        }

        .original-line {
            margin: 12px 0;
            color: #212529;
        }

        .translated-line {
            color: #6c757d;
            font-size: 0.9em;
            display: none;
        }

        .show-translation .translated-line {
            display: block;
        }
    </style>
</head>

<body>
    <div class="poem-container">
        <a href="/" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
            返回首页
        </a>
        <h1 class="poem-title" id="poemTitle"></h1>
        <div class="poem-meta" id="poemMeta"></div>
        <button class="translation-toggle" onclick="toggleTranslation()">显示翻译</button>
        <div class="poem-content" id="poemContent"></div>
    </div>

    <script>
        async function loadPoem() {
            const title = decodeURIComponent(location.pathname.slice(1));
            try {
                const response = await fetch(`/poem?title=${title}`);
                if (!response.ok) throw new Error('未找到对应的古诗文');
                const poem = await response.json();

                document.title = poem.title;
                document.getElementById('poemTitle').textContent = poem.title;

                // 设置作者名为可点击链接
                document.getElementById('poemMeta').innerHTML = `
                    【${poem.dynasty}】<a href="/author/${encodeURIComponent(poem.author)}" class="author-link">${poem.author}</a>
                `;

                // 生成带样式的内容
                const contentHTML = poem.content.map(c => {
                    const lineStyle = c.display || poem.display;
                    return `
                        <div class="line-container ${lineStyle ? 'text-' + lineStyle : ''}">
                            <div class="original-line">${c.line}</div>
                            <div class="translated-line">${c.trans}</div>
                        </div>
                    `;
                }).join('');

                document.getElementById('poemContent').innerHTML = contentHTML;
            } catch (error) {
                document.body.innerHTML = '<h1>加载失败</h1>';
                console.error(error);
            }
        }

        function toggleTranslation() {
            const container = document.getElementById('poemContent');
            const button = document.querySelector('.translation-toggle');
            container.classList.toggle('show-translation');

            button.textContent = container.classList.contains('show-translation')
                ? '隐藏翻译'
                : '显示翻译';
        }

        loadPoem();
    </script>
</body>

</html>
