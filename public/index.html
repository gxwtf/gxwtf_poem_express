<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广学古诗文</title>
    <link rel="stylesheet" href="/css/font_awesome6.all.min.css">
    <style>
        :root {
            --primary-color: #A31F24;
            --tag-color: #1890ff;
        }

        body {
            font-family: "思源宋体", SimSun, serif;
            background: #f8f9fa;
            margin: 0;
        }

        .navbar {
            padding: 12px 24px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-color);
        }

        .poem-container {
            padding-top: 16px;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .poem-card {
            background: #fff;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 16px;
            position: relative;
        }

        .poem-title {
            color: var(--primary-color);
            margin: 0 0 8px;
            font-size: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            position: relative;
        }

        .poem-title:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            white-space: normal;
            width: max-content;
            max-width: 300px;
            z-index: 10;
            pointer-events: none;
        }

        .poem-meta {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .tag-container {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
            position: static;
        }

        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid;
        }

        .tag-required {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .tag-literary {
            color: var(--tag-color);
            border-color: var(--tag-color);
        }

        .version-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .toggle-icon {
            cursor: pointer;
            color: var(--primary-color);
            font-size: 24px;
            transition: transform 0.3s;
        }

        .toggle-icon.active {
            color: var(--tag-color);
        }

        .poem-preview {
            line-height: 1.6;
            color: #495057;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: calc(3 * 1.6em);
            /* 根据行高动态计算 */
        }

        .search-section {
            padding: 20px 24px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 48px 12px 16px;
            border: 2px solid var(--primary-color);
            border-radius: 30px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(163, 31, 36, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 20px;
        }

        .filter-tags {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-group {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .filter-title {
            color: var(--primary-color);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .tag-btn {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            margin: 4px;
        }

        .tag-btn.active {
            border-color: var(--primary-color);
            background: rgba(163, 31, 36, 0.1);
            color: var(--primary-color);
        }

        .selected-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1>广学古诗文</h1>
        <!-- 添加切换按钮 -->
        <div class="version-toggle">
            <span>高中版</span>
            <i id="versionSwitch" class="fas fa-toggle-on toggle-icon"></i>
        </div>
    </nav>

    <section class="search-section">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="搜索古诗文..." id="searchInput">
            <i class="fas fa-search search-icon"></i>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="filter-tags">
                <div class="filter-group">
                    <div class="filter-title">教材</div>
                    <div class="tag-group">
                        <button class="tag-btn" data-type="教材" data-value="必修上">必修上</button>
                        <button class="tag-btn" data-type="教材" data-value="必修下">必修下</button>
                        <button class="tag-btn" data-type="教材" data-value="选必上">选必上</button>
                        <button class="tag-btn" data-type="教材" data-value="选必中">选必中</button>
                        <button class="tag-btn" data-type="教材" data-value="选必下">选必下</button>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-title">文体</div>
                    <div class="tag-group">
                        <button class="tag-btn" data-type="文体" data-value="诗">诗</button>
                        <button class="tag-btn" data-type="文体" data-value="词">词</button>
                        <button class="tag-btn" data-type="文体" data-value="曲">曲</button>
                        <button class="tag-btn" data-type="文体" data-value="文言文">文言文</button>
                        <button class="tag-btn" data-type="文体" data-value="戏剧">戏剧</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="poem-container" id="poemContainer"></div>
    <script>
        /* ================= 全局状态 ================= */
        let currentVersion = 'senior';
        const currentFilters = { search: '', tags: {} }; // tags 改为对象

        /* ============ 调整预览行数 ============ */
        function adjustPreviewHeight(card) {
            const preview = card.querySelector('.poem-preview');
            const lineHeight = parseInt(getComputedStyle(preview).lineHeight);
            const maxHeight = card.clientHeight - 120;
            const availableLines = Math.floor(maxHeight / lineHeight);
            preview.style.webkitLineClamp = Math.max(1, availableLines);
        }

        /* ================= 构建查询参数 ================= */
        function buildQueryParams() {
            const params = new URLSearchParams();
            params.append('version', currentVersion);

            if (currentFilters.search) {
                params.append('search', currentFilters.search);
            }

            if (Object.keys(currentFilters.tags).length > 0) {
                // 按类别解析标签为字符串
                const tagsString = Object.values(currentFilters.tags)
                    .map(group => group.join(','))
                    .join(';');
                params.append('tags', tagsString);
            }

            return params.toString();
        }

        /* ============== 渲染诗文卡片 ============== */
        function renderPoems(poems) {
            const container = document.getElementById('poemContainer');
            container.innerHTML = poems.map(poem => `
                <div class="poem-card" onclick="location.href='/${encodeURIComponent(poem.title)}'">
                    <h2 class="poem-title" data-title="${poem.title}">${poem.title}</h2>
                    <div class="poem-meta">【${poem.dynasty}】${poem.author}</div>
                    <div class="poem-preview">${poem.content.map(c => c.line).join('')}</div>
                    <div class="tag-container">
                        ${poem.tags.map(tag => `
                            <div class="tag ${tag.includes('必修') ? 'tag-required' : 'tag-literary'}">
                                ${tag}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('.poem-card').forEach(adjustPreviewHeight);
        }

        /* ============== 标签点击事件 ============== */
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');

                // 更新当前过滤器
                const category = btn.closest('.filter-group').querySelector('.filter-title').textContent.trim();
                if (!currentFilters.tags[category]) {
                    currentFilters.tags[category] = [];
                }

                const value = btn.dataset.value;
                if (btn.classList.contains('active')) {
                    currentFilters.tags[category].push(value);
                } else {
                    currentFilters.tags[category] = currentFilters.tags[category].filter(tag => tag !== value);
                    if (currentFilters.tags[category].length === 0) {
                        delete currentFilters.tags[category];
                    }
                }

                // 输出调试日志
                console.log('当前过滤器标签:', currentFilters.tags);

                // 更新已选标签显示
                document.getElementById('selectedTags').innerHTML = Object.entries(currentFilters.tags)
                    .map(([category, values]) => `
                        <div class="filter-group">
                            <div class="filter-title">${category}</div>
                            ${values.map(value => `<div class="tag-btn active">${value}</div>`).join('')}
                        </div>
                    `).join('');

                // 重新加载数据
                loadData();
            });
        });

        /* ============== 数据加载 ============== */
        async function loadData() {
            try {
                const res = await fetch(`/poem?${buildQueryParams()}`);
                console.log('请求参数:', buildQueryParams());
                const poems = await res.json();
                renderPoems(poems);
            } catch (err) {
                console.error('加载失败:', err);
            }
        }

        /* ============== 事件监听 ============== */
        document.getElementById('versionSwitch').addEventListener('click', () => {
            currentVersion = currentVersion === 'senior' ? 'junior' : 'senior';
            document.querySelector('#versionSwitch + span').textContent = currentVersion === 'senior' ? '高中版' : '初中版';
            loadData();
        });

        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            currentFilters.search = e.target.value;
            searchTimer = setTimeout(loadData, 500);
        });

        // 初始化加载
        loadData();
    </script>
</body>

</html>
