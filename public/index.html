<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广学古诗文</title>
    <link rel="stylesheet" href="/css/font_awesome6.all.min.css">
    <style>
        :root {
            --primary-color: #A31F24;
            --tag-color: #1890ff;
        }

        body {
            font-family: "思源宋体", SimSun, serif;
            background: #f8f9fa;
            margin: 0;
        }

        .navbar {
            padding: 12px 24px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-color);
        }

        .poem-container {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .poem-card {
            background: #fff;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            padding: 16px;
            position: relative;
        }

        .poem-title {
            color: var(--primary-color);
            margin: 0 0 8px;
            font-size: 20px;
        }

        .poem-meta {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .tag-container {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 6px;
        }

        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid;
        }

        .tag-required {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .tag-literary {
            color: var(--tag-color);
            border-color: var(--tag-color);
        }

        .version-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .toggle-icon {
            cursor: pointer;
            color: var(--primary-color);
            font-size: 24px;
            transition: transform 0.3s;
        }

        .toggle-icon.active {
            color: var(--tag-color);
        }

        .poem-preview {
            line-height: 1.6;
            color: #495057;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: calc(3 * 1.6em);
            /* 根据行高动态计算 */
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h1>广学古诗文</h1>
        <!-- 添加切换按钮 -->
        <div class="version-toggle">
            <span>高中版</span>
            <i id="versionSwitch" class="fas fa-toggle-on toggle-icon"></i>
        </div>
    </nav>

    <div class="poem-container" id="poemContainer"></div>
    <script>
        let currentVersion = 'senior';

        // 动态计算显示行数
        function adjustPreviewHeight(card) {
            const preview = card.querySelector('.poem-preview');
            const lineHeight = parseInt(getComputedStyle(preview).lineHeight);
            const maxHeight = card.clientHeight - 120; // 减去标题和元数据的高度

            const availableLines = Math.floor(maxHeight / lineHeight);
            preview.style.webkitLineClamp = Math.max(1, availableLines);
        }

        async function loadPoems(version) {
            try {
                const response = await fetch(`/poem/${version}`);
                const poems = await response.json();

                const container = document.getElementById('poemContainer');
                container.innerHTML = poems.map(poem => `
                    <div class="poem-card" onclick="location.href='/${encodeURIComponent(poem.title)}'" style="cursor: pointer;">
                        <div class="tag-container">
                            ${poem.tags.map(tag => `
                                <div class="tag ${tag.includes('必修') ? 'tag-required' : 'tag-literary'}">
                                    ${tag}
                                </div>
                            `).join('')}
                        </div>
                        <h2 class="poem-title">${poem.title}</h2>
                        <div class="poem-meta">【${poem.dynasty}】${poem.author}</div>
                        <div class="poem-preview">${poem.content.map(c => c.line).join('')}</div>
                    </div>
                `).join('');

                // 动态调整每张卡片的内容显示
                container.querySelectorAll('.poem-card').forEach(adjustPreviewHeight);
            } catch (error) {
                console.error('加载失败:', error);
            }
        }

        // 切换版本事件
        document.getElementById('versionSwitch').addEventListener('click', async () => {
            currentVersion = currentVersion === 'senior' ? 'junior' : 'senior';
            const toggle = document.getElementById('versionSwitch');

            toggle.classList.toggle('fa-toggle-on');
            toggle.classList.toggle('fa-toggle-off');
            toggle.parentNode.querySelector('span').textContent = currentVersion === 'senior' ? '高中版' : '初中版';

            await loadPoems(currentVersion);
        });

        // 初始化加载
        loadPoems(currentVersion);
    </script>
</body>

</html>
